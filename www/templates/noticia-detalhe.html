
<ion-view view-title="Detalhes da Notícia">

    <ion-content class="padding">

        <!-- Notícia encontrada -->
        <div class="card" ng-if="noticia">

            <div class="item item-divider">
                {{ noticia.categoria }}
            </div>

            <div class="item item-body">

                <h2>{{ noticia.titulo }}</h2>

                <p>
                    <i class="icon ion-calendar"></i>
                    {{ noticia.data }}
                </p>

                <!-- Imagem da notícia -->
                <img ng-src="{{ noticia.imagem }}"
                     alt="{{ noticia.titulo }}"
                     style="width: 100%; border-radius: 5px;"
                     ng-if="noticia.imagem">

                <p>{{ noticia.descricao }}</p>

            </div>

        </div>

        <!-- Notícia não encontrada -->
        <div class="text-center" ng-if="!noticia">
            <h4>Notícia não encontrada.</h4>
            <p>O conteúdo solicitado não está disponível.</p>
        </div>

        <button class="button button-positive button-block"
                ui-sref="app.noticias">
            Voltar para Notícias
        </button>

    </ion-content>

</ion-view>
