
<ion-side-menus
    enable-menu-with-back-views="false"
    ng-controller="MenuCtrl">

    <!-- Área principal do aplicativo -->
    <ion-side-menu-content>

        <ion-nav-bar class="bar-positive">

            <ion-nav-back-button>
            </ion-nav-back-button>

            <ion-nav-buttons side="left">
                <button class="button button-icon button-clear ion-navicon"
                        menu-toggle="left">
                </button>
            </ion-nav-buttons>

        </ion-nav-bar>

        <ion-nav-view name="menuContent"></ion-nav-view>

    </ion-side-menu-content>

    <!-- Menu lateral -->
    <ion-side-menu side="left">

        <ion-header-bar class="bar-positive">
            <h1 class="title">Portal UCSal</h1>
        </ion-header-bar>

        <ion-content>

            <ion-list>

                <ion-item class="item-icon-left"
                          menu-close
                          ui-sref="app.noticias">
                    <i class="icon ion-home"></i>
                    Notícias e Eventos
                </ion-item>

                <ion-item class="item-icon-left"
                          menu-close
                          ui-sref="app.perfil">
                    <i class="icon ion-person"></i>
                    Meu Perfil
                </ion-item>

                <ion-item class="item-icon-left"
                          menu-close
                          ui-sref="app.financeiro">
                    <i class="icon ion-card"></i>
                    Financeiro
                </ion-item>

                <ion-item class="item-icon-left"
                          menu-close
                          ng-click="sair()">
                    <i class="icon ion-log-out"></i>
                    Sair
                </ion-item>

            </ion-list>

        </ion-content>

    </ion-side-menu>

</ion-side-menus>
